[project]
name = "confluence"
version = "0.1.0"
description = "Relational transformer model for database learning"
requires-python = ">=3.13"
dependencies = [
    "jax[cuda13]",
    "flax",
    "optax",
    "numpy",
    "headwater",
    "jaxtyping>=0.3.9",
    "loguru>=0.7.3",
    "tqdm>=4.67.3",
]

[project.scripts]
train = "confluence.train:main"

[tool.uv.workspace]
members = ["headwater"]

[tool.uv.sources]
headwater = { workspace = true }

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "deptry>=0.24.0",
    "line-profiler>=5.0.1",
    "memray>=1.19.1",
    "pytest>=9.0.2",
    "pytest-loguru>=0.4.0",
    "ruff>=0.15.2",
    "ty>=0.0.18",
    "types-tqdm>=4.67.3.20260205",
]
scripts = [
    "duckdb>=1.4.4",
    "pyarrow>=23.0.0",
    "pydantic-ai-slim[openrouter]>=1.59.0",
    "rich>=14.3.3",
]

[tool.ruff]
line-length = 150
target-version = "py313"

[tool.ruff.lint]
preview = true
select = [
    "I",
    "E",
    "F",
    "W",
    "B",
    "N",
    "C90",
    "UP",
    "ANN",
    "C4",
    "PT",
    "Q",
    "RET",
    "SIM",
    "TID",
    "ARG",
    "PTH",
    "TD",
    "PD",
    "PL",
    "TRY",
    "FLY",
    "NPY",
    "PERF",
    "RUF",
]
ignore = ["TD003", "F722", "PLR0914", "TRY003", "SIM108", "PLR0913", "PLR0917", "C901"]
unfixable = ["B"]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
addopts = "--capture=no"

[build-system]
requires = ["hatchling", "torch"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["confluence"]
